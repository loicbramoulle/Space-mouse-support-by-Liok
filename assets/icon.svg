<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title">
  <title id="title">SpaceMouse Bridge for Godot</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3346"/>
      <stop offset="1" stop-color="#171d29"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d99ad"/>
      <stop offset="0.45" stop-color="#d5dce8"/>
      <stop offset="1" stop-color="#7b879b"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b3240"/>
      <stop offset="0.5" stop-color="#454e60"/>
      <stop offset="1" stop-color="#262c38"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- base -->
  <path d="M58 182v14c0 11 31 20 70 20s70-9 70-20v-14z" fill="url(#base)"/>
  <ellipse cx="128" cy="182" rx="70" ry="20" fill="#5a6476"/>

  <!-- light ring -->
  <ellipse cx="128" cy="176" rx="42" ry="12" fill="none" stroke="#4fb8ff" stroke-width="5"/>

  <!-- cap -->
  <path d="M86 132v42c0 7 19 12 42 12s42-5 42-12v-42z" fill="url(#cap)"/>
  <ellipse cx="128" cy="132" rx="42" ry="12" fill="#eef2f8"/>
  <ellipse cx="128" cy="132" rx="30" ry="8" fill="#dfe5ef"/>

  <!-- axis gizmo -->
  <g stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M128 126V62" stroke="#8fdc5a"/>
    <path d="M128 126L184 98" stroke="#ff5d6c"/>
    <path d="M128 126L72 98" stroke="#4fa3ff"/>
  </g>
  <path d="M128 40l14 24h-28z" fill="#8fdc5a"/>
  <path d="M204 88l-15 23-12-25z" fill="#ff5d6c"/>
  <path d="M52 88l15 23 12-25z" fill="#4fa3ff"/>
  <circle cx="128" cy="126" r="8" fill="#eef2f8"/>
</svg>
